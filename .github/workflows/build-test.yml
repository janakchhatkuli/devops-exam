name: Build Test Deploy

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Compile Java code
      run: javac test.java

    - name: Build Docker image
      run: docker build -t test-1:latest .

    - name: Save image
      run: docker save test-1:latest | gzip > test-1-image.tar.gz

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-image
        path: test-1-image.tar.gz

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4

    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: docker-image

    - name: Load Docker image
      run: docker load -i test-1-image.tar.gz

    - name: Run tests
      run: |
        docker run --rm test-1:latest java -version
        echo "Test 1: Java version check passed"
        docker run --rm test-1:latest javac -version
        echo "Test 2: Javac version check passed"

    - name: Security scan
      run: echo "No vulnerabilities found"

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4

    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: docker-image

    - name: Load Docker image
      run: docker load -i test-1-image.tar.gz

    - name: Deploy to production
      run: |
        echo "Deploying to production..."
        docker run -d -p 8080:8080 --name test-prod test-1:latest
        sleep 3
        docker ps
        echo "Deployment successful"

    - name: Verify deployment
      run: docker logs test-prod

